name: Firmware

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Native core tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PlatformIO
        run: python -m pip install -r requirements-dev.txt

      - name: Run native tests
        run: pio test -c platformio.test.ini -e native

  build:
    name: Build ${{ matrix.environment }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - cyd
          - cyd2usb
          - diag
          - esp32_3248s035c
          - diag_esp32_3248s035c
          - touchdiag_esp32_3248s035c

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: python -m pip install -r requirements-dev.txt

      - name: Build firmware
        run: pio run -e ${{ matrix.environment }}
