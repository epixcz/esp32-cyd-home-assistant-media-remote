; ESP32 Cheap Yellow Display Home Assistant media remote

[platformio]
src_dir = src
default_envs = cyd

[env]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800
lib_ldf_mode = deep
lib_deps =
	bblanchon/ArduinoJson@6.21.6
	bodmer/TFT_eSPI@2.5.43
	bodmer/TJpg_Decoder@1.1.0
	wnatth3/WiFiManager@2.0.16-rc.2
	links2004/WebSockets@2.7.3
build_flags =
	-DUSER_SETUP_LOADED
	-DLOAD_GLCD
	-DLOAD_FONT2
	-DLOAD_FONT4

[env:cyd]
build_flags =
	${env.build_flags}
	-DPANEL_CYD_2432S028R
	-DILI9341_2_DRIVER
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BL=21
	-DTFT_BACKLIGHT_ON=HIGH
	-DTFT_BACKLIGHT_OFF=LOW
	-DSPI_FREQUENCY=55000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DUSE_HSPI_PORT
	-DTFT_INVERSION_OFF

[env:cyd2usb]
build_flags =
	${env.build_flags}
	-DPANEL_CYD_2432S028R
	-DILI9341_2_DRIVER
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BL=21
	-DTFT_BACKLIGHT_ON=HIGH
	-DTFT_BACKLIGHT_OFF=LOW
	-DSPI_FREQUENCY=55000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DUSE_HSPI_PORT
	-DTFT_INVERSION_ON

[env:cyd_ota]
extends = env:cyd
upload_protocol = espota
upload_port = 192.168.2.105
upload_flags = --auth=cydmedia

[env:diag]
build_flags =
	${env.build_flags}
	-DPANEL_CYD_2432S028R
	-DILI9341_2_DRIVER
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BL=21
	-DTFT_BACKLIGHT_ON=HIGH
	-DTFT_BACKLIGHT_OFF=LOW
	-DSPI_FREQUENCY=55000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DUSE_HSPI_PORT
	-DTFT_INVERSION_OFF
	-DDIAGNOSTIC_TFT

[env:esp32_3248s035c]
lib_deps =
	${env.lib_deps}
	https://github.com/TAMCTec/gt911-arduino.git#b3f175e65a799368be9c544e255204e1e74ad2ed
build_flags =
	${env.build_flags}
	-DPANEL_ESP32_3248S035C
	-DST7796_DRIVER
	-DTFT_WIDTH=320
	-DTFT_HEIGHT=480
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BL=27
	-DTFT_BACKLIGHT_ON=HIGH
	-DTFT_BACKLIGHT_OFF=LOW
	-DSPI_FREQUENCY=80000000
	-DSPI_READ_FREQUENCY=20000000
	-DUSE_HSPI_PORT
	-DTFT_INVERSION_OFF

[env:esp32_3248s035c_ota]
extends = env:esp32_3248s035c
upload_protocol = espota
upload_port = 192.168.2.139
upload_flags = --auth=cydmedia

